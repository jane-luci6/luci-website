<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant A — Black Boxes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --navy-deep: #0A161C; --mint: #68E3BE; --off-white: #F5F8FA; --amber: #EDD086; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--navy-deep); color: var(--off-white); font-family: 'Inter', sans-serif; padding: 40px 20px; }
  .label { text-align: center; font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 0.22em; color: var(--mint); margin-bottom: 16px; }
  .desc { text-align: center; font-size: 14px; color: rgba(245,248,250,0.6); margin-bottom: 32px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  svg { width: 100%; max-width: 900px; height: auto; display: block; margin: 0 auto; }
  .s { font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
  .b { font-size: 13px; line-height: 1.5; color: rgba(245,248,250,0.75); display: block; }
  .s1, .s1 ~ .b { color: #68E3BE; } .s2, .s2 ~ .b { color: #8ed3b5; } .s3, .s3 ~ .b { color: #bcae7a; } .s4, .s4 ~ .b { color: #EDD086; }
</style>
</head>
<body>
<div class="label">A — Black Boxes</div>
<div class="desc">A/V systems as dark, opaque rectangles — literal "black boxes you can't see into." They sit above a "YOUR NETWORK" line they're not connected to. More boxes accumulate per stage, alerts appear on them.</div>
<svg viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet">
  <line x1="40" y1="215" x2="960" y2="215" stroke="rgba(104,227,190,0.15)" stroke-width="1.5" stroke-dasharray="4 8"/>
  <text x="500" y="237" text-anchor="middle" fill="rgba(104,227,190,0.35)" font-size="11" font-family="Inter" letter-spacing="0.15em">YOUR NETWORK</text>
  <!-- S1 -->
  <rect x="95" y="130" width="60" height="60" rx="4" fill="#0F1E26" stroke="#68E3BE" stroke-width="2"/>
  <text x="125" y="166" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="11" font-family="Inter">?</text>
  <foreignObject x="10" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s1">The Silos</span><span class="b">A/V runs on separate, proprietary systems — each one a black box you can't see into.</span></div></foreignObject>
  <!-- S2 -->
  <rect x="335" y="110" width="55" height="55" rx="4" fill="#0F1E26" stroke="#8ed3b5" stroke-width="2"/>
  <text x="362" y="143" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="10" font-family="Inter">?</text>
  <rect x="395" y="145" width="55" height="55" rx="4" fill="#0F1E26" stroke="#8ed3b5" stroke-width="2"/>
  <text x="422" y="178" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="10" font-family="Inter">?</text>
  <path d="M 362 92 L 368 102 L 356 102 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="260" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s2">The Blind Spot</span><span class="b">You can't monitor what's running, what's exposed, or what's failing — because it's not on your network.</span></div></foreignObject>
  <!-- S3 -->
  <rect x="570" y="95" width="50" height="50" rx="4" fill="#0F1E26" stroke="#bcae7a" stroke-width="2"/>
  <text x="595" y="125" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <rect x="625" y="130" width="50" height="50" rx="4" fill="#0F1E26" stroke="#bcae7a" stroke-width="2"/>
  <text x="650" y="160" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <rect x="680" y="155" width="50" height="50" rx="4" fill="#0F1E26" stroke="#bcae7a" stroke-width="2"/>
  <text x="705" y="185" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <path d="M 595 77 L 601 87 L 589 87 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 650 112 L 656 122 L 644 122 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="510" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s3">The Vendors</span><span class="b">Each system came with its own vendor, contract, and support line — and none of them talk to each other.</span></div></foreignObject>
  <!-- S4 -->
  <rect x="815" y="85" width="46" height="46" rx="4" fill="#0F1E26" stroke="#EDD086" stroke-width="2"/>
  <text x="838" y="113" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <rect x="865" y="120" width="46" height="46" rx="4" fill="#0F1E26" stroke="#EDD086" stroke-width="2"/>
  <text x="888" y="148" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <rect x="830" y="155" width="46" height="46" rx="4" fill="#0F1E26" stroke="#EDD086" stroke-width="2"/>
  <text x="853" y="183" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <rect x="880" y="170" width="46" height="46" rx="4" fill="#0F1E26" stroke="#EDD086" stroke-width="2"/>
  <text x="903" y="198" text-anchor="middle" fill="rgba(245,248,250,0.25)" font-size="9" font-family="Inter">?</text>
  <path d="M 838 67 L 844 77 L 832 77 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 888 102 L 894 112 L 882 112 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 853 137 L 859 147 L 847 147 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="760" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s4">The Page</span><span class="b">When any of it fails, it's your phone that rings — and you have no way to diagnose it.</span></div></foreignObject>
</svg>
</body>
</html>
