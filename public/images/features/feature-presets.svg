<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Saved scenes scheduled across a day, from morning to night, on a timeline">
  <defs>
    <linearGradient id="pr-morning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2D89A"/><stop offset="1" stop-color="#EDD086"/></linearGradient>
    <linearGradient id="pr-midday" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDEBDF"/><stop offset="1" stop-color="#A9DEC9"/></linearGradient>
    <linearGradient id="pr-evening" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FE6C6"/><stop offset="1" stop-color="#4FB59A"/></linearGradient>
    <linearGradient id="pr-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#234C5C"/><stop offset="1" stop-color="#0E222C"/></linearGradient>
    <linearGradient id="pr-day" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDD086" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#A9DEC9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0E222C" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="pr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#68E3BE" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#68E3BE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pr-head { transform-box: fill-box; transform-origin: center; animation: pr-head 4s ease-in-out infinite; }
      .pr-head.b { animation-delay: -1s; }
      .pr-head.c { animation-delay: -2s; }
      .pr-head.d { animation-delay: -3s; }
      .pr-play { animation: pr-play 6s ease-in-out infinite; }
      @keyframes pr-head { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      @keyframes pr-play { 0% { transform: translateX(0); } 50% { transform: translateX(192px); } 100% { transform: translateX(0); } }
      @media (prefers-reduced-motion: reduce) { .pr-head, .pr-play { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="180" fill="url(#pr-glow)"/>
  <rect x="20" y="40" width="280" height="98" rx="12" fill="url(#pr-day)" stroke="rgba(104,227,190,0.18)" stroke-width="1"/>
  <!-- clock badge -->
  <circle cx="42" cy="28" r="13" fill="#132a38" stroke="rgba(104,227,190,0.35)" stroke-width="1"/>
  <path d="M42 28V20M42 28l6 3" fill="none" stroke="#68E3BE" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="42" cy="28" r="1.6" fill="#68E3BE"/>
  <!-- scene cards -->
  <g stroke="rgba(104,227,190,0.26)" stroke-width="1">
    <rect x="36" y="50" width="56" height="74" rx="9" fill="#132a38"/>
    <rect x="100" y="50" width="56" height="74" rx="9" fill="#132a38"/>
    <rect x="164" y="50" width="56" height="74" rx="9" fill="#132a38"/>
    <rect x="228" y="50" width="56" height="74" rx="9" fill="#132a38"/>
  </g>
  <path class="pr-head" d="M36 59a9 9 0 0 1 9-9h38a9 9 0 0 1 9 9v18H36z" fill="url(#pr-morning)"/>
  <circle cx="64" cy="65" r="7" fill="#FFF7E6" opacity="0.9"/>
  <rect x="46" y="88" width="36" height="4.5" rx="2.2" fill="#E6F5EF" opacity="0.8"/><rect x="46" y="98" width="24" height="3.6" rx="1.8" fill="#E6F5EF" opacity="0.35"/>
  <path class="pr-head b" d="M100 59a9 9 0 0 1 9-9h38a9 9 0 0 1 9 9v18h-56z" fill="url(#pr-midday)"/>
  <circle cx="128" cy="65" r="7" fill="#FFFFFF" opacity="0.92"/><g stroke="#FFFFFF" stroke-width="1.4" opacity="0.9"><line x1="128" y1="54" x2="128" y2="50.5"/><line x1="128" y1="76" x2="128" y2="79.5"/><line x1="117" y1="65" x2="113.5" y2="65"/><line x1="139" y1="65" x2="142.5" y2="65"/></g>
  <rect x="110" y="88" width="36" height="4.5" rx="2.2" fill="#E6F5EF" opacity="0.8"/><rect x="110" y="98" width="24" height="3.6" rx="1.8" fill="#E6F5EF" opacity="0.35"/>
  <path class="pr-head c" d="M164 59a9 9 0 0 1 9-9h38a9 9 0 0 1 9 9v18h-56z" fill="url(#pr-evening)"/>
  <path d="M178 70a14 14 0 0 1 28 0z" fill="#FFFFFF" opacity="0.88"/>
  <rect x="174" y="88" width="36" height="4.5" rx="2.2" fill="#E6F5EF" opacity="0.8"/><rect x="174" y="98" width="24" height="3.6" rx="1.8" fill="#E6F5EF" opacity="0.35"/>
  <path class="pr-head d" d="M228 59a9 9 0 0 1 9-9h38a9 9 0 0 1 9 9v18h-56z" fill="url(#pr-night)"/>
  <path d="M261 58a7 7 0 1 0 0 14 8.5 8.5 0 0 1 0-14z" fill="#EDD086"/>
  <circle cx="248" cy="60" r="0.9" fill="#E6F5EF"/><circle cx="270" cy="68" r="0.9" fill="#E6F5EF"/><circle cx="244" cy="68" r="0.7" fill="#E6F5EF"/>
  <rect x="238" y="88" width="36" height="4.5" rx="2.2" fill="#E6F5EF" opacity="0.8"/><rect x="238" y="98" width="24" height="3.6" rx="1.8" fill="#E6F5EF" opacity="0.35"/>
  <!-- timeline -->
  <rect x="36" y="148" width="248" height="4" rx="2" fill="#E6F5EF" opacity="0.18"/>
  <g fill="#68E3BE"><circle cx="64" cy="150" r="3.2"/><circle cx="128" cy="150" r="3.2"/><circle cx="192" cy="150" r="3.2"/><circle cx="256" cy="150" r="3.2"/></g>
  <g class="pr-play">
    <line x1="64" y1="140" x2="64" y2="160" stroke="#68E3BE" stroke-width="2"/>
    <circle cx="64" cy="138" r="3.6" fill="#68E3BE"/>
  </g>
</svg>
