<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Many kinds of devices connecting into one central LUCI hub">
  <defs>
    <linearGradient id="o-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C4555"/>
      <stop offset="1" stop-color="#0E222C"/>
    </linearGradient>
    <radialGradient id="o-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#68E3BE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#68E3BE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .o-line { animation: o-flow 2.6s ease-in-out infinite; }
      .o-line.b { animation-delay: -0.9s; }
      .o-line.c { animation-delay: -1.7s; }
      .o-ring { transform-box: fill-box; transform-origin: center; animation: o-spin 9s linear infinite; }
      @keyframes o-flow { 0%,100% { stroke-opacity: 0.22; } 50% { stroke-opacity: 0.6; } }
      @keyframes o-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .o-line, .o-ring { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="180" fill="url(#o-glow)"/>
  <g stroke="#68E3BE" stroke-width="1.4" fill="none">
    <line class="o-line" x1="160" y1="90" x2="76" y2="44"/>
    <line class="o-line b" x1="160" y1="90" x2="244" y2="44"/>
    <line class="o-line c" x1="160" y1="90" x2="46" y2="90"/>
    <line class="o-line" x1="160" y1="90" x2="274" y2="90"/>
    <line class="o-line b" x1="160" y1="90" x2="76" y2="136"/>
    <line class="o-line c" x1="160" y1="90" x2="244" y2="136"/>
  </g>
  <!-- device tiles (dark, mint hairline) -->
  <g stroke="rgba(104,227,190,0.32)" stroke-width="1">
    <rect x="54" y="27" width="44" height="34" rx="6" fill="#132a38"/>
    <rect x="222" y="27" width="44" height="34" rx="6" fill="#132a38"/>
    <rect x="24" y="73" width="44" height="34" rx="6" fill="#132a38"/>
    <rect x="252" y="73" width="44" height="34" rx="6" fill="#132a38"/>
    <rect x="54" y="119" width="44" height="34" rx="6" fill="#132a38"/>
    <rect x="222" y="119" width="44" height="34" rx="6" fill="#132a38"/>
  </g>
  <!-- device innards (mint-lit) -->
  <rect x="65" y="36" width="22" height="13" rx="1.5" fill="#0A1A24"/><rect x="67" y="38" width="18" height="3" fill="#68E3BE"/>
  <rect x="73" y="49" width="6" height="3" fill="#68E3BE"/><rect x="69" y="52" width="14" height="2" rx="1" fill="#68E3BE" opacity="0.5"/>
  <rect x="236" y="33" width="16" height="22" rx="2.5" fill="#0A1A24"/>
  <circle cx="244" cy="40" r="2.3" fill="#68E3BE"/><circle cx="244" cy="48" r="3.4" fill="none" stroke="#68E3BE" stroke-width="1.4"/>
  <rect x="39" y="79" width="14" height="20" rx="1.5" fill="#0A1A24"/>
  <rect x="41" y="82" width="10" height="2.4" fill="#68E3BE"/><rect x="41" y="86" width="10" height="1.6" fill="#E6F5EF" opacity="0.5"/><rect x="41" y="89" width="7" height="1.6" fill="#E6F5EF" opacity="0.5"/>
  <rect x="264" y="82" width="20" height="15" rx="2" fill="#0A1A24"/>
  <circle cx="274" cy="89" r="4.2" fill="none" stroke="#68E3BE" stroke-width="1.5"/><circle cx="274" cy="89" r="1.4" fill="#68E3BE"/>
  <rect x="280" y="84" width="3" height="2.4" fill="#68E3BE"/>
  <rect x="66" y="126" width="20" height="20" rx="5" fill="#0A1A24"/>
  <polygon points="73,132 73,142 82,137" fill="#68E3BE"/>
  <path d="M232 140a6 6 0 0 1 1.5-11.6 8 8 0 0 1 15.2 2.2 5.5 5.5 0 0 1-1.7 10.8z" fill="#0A1A24"/>
  <path d="M240 130v8M236.5 134.5l3.5-3.5 3.5 3.5" fill="none" stroke="#68E3BE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- central hub -->
  <circle cx="160" cy="90" r="30" fill="#68E3BE" opacity="0.08"/>
  <rect x="138" y="68" width="44" height="44" rx="11" fill="url(#o-core)" stroke="rgba(104,227,190,0.4)" stroke-width="1"/>
  <circle class="o-ring" cx="160" cy="90" r="13" fill="none" stroke="#68E3BE" stroke-width="2" stroke-dasharray="14 8"/>
  <circle cx="160" cy="90" r="7" fill="none" stroke="#68E3BE" stroke-width="1.5" opacity="0.7"/>
  <circle cx="160" cy="90" r="3.4" fill="#EDD086"/>
</svg>
