<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="A monitoring screen with a live health gauge, pulse line, and an alert being caught">
  <defs>
    <linearGradient id="mn-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143042"/>
      <stop offset="1" stop-color="#0A1A24"/>
    </linearGradient>
    <radialGradient id="mn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#68E3BE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#68E3BE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mn-pulse { stroke-dasharray: 10 8; animation: mn-march 1.6s linear infinite; }
      .mn-alert { transform-box: fill-box; transform-origin: center; animation: mn-alert 2.4s ease-in-out infinite; }
      .mn-gauge { animation: mn-gauge 3.2s ease-in-out infinite; }
      @keyframes mn-march { to { stroke-dashoffset: -36; } }
      @keyframes mn-alert { 0%,100% { opacity: 0.78; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes mn-gauge { 0%,100% { stroke-opacity: 0.7; } 50% { stroke-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .mn-pulse, .mn-alert, .mn-gauge { animation: none; } }
    </style>
  </defs>
  <rect width="320" height="180" fill="url(#mn-glow)"/>
  <rect x="30" y="26" width="260" height="128" rx="13" fill="url(#mn-screen)" stroke="rgba(104,227,190,0.28)" stroke-width="1"/>
  <g stroke="#E6F5EF" stroke-opacity="0.08" stroke-width="1">
    <line x1="48" y1="118" x2="272" y2="118"/><line x1="48" y1="100" x2="272" y2="100"/><line x1="48" y1="82" x2="272" y2="82"/>
  </g>
  <!-- health gauge -->
  <circle cx="78" cy="68" r="22" fill="none" stroke="#E6F5EF" stroke-opacity="0.14" stroke-width="5"/>
  <circle class="mn-gauge" cx="78" cy="68" r="22" fill="none" stroke="#68E3BE" stroke-width="5" stroke-linecap="round" stroke-dasharray="100 38" transform="rotate(-90 78 68)"/>
  <circle cx="78" cy="68" r="3" fill="#68E3BE"/>
  <rect x="112" y="56" width="44" height="5" rx="2.5" fill="#E6F5EF" opacity="0.3"/>
  <rect x="112" y="68" width="30" height="4" rx="2" fill="#E6F5EF" opacity="0.18"/>
  <!-- pulse line -->
  <path d="M48 116 H92 L104 92 L116 132 L128 108 L150 108 H196 L208 84 L220 124 L232 108 H272"
        fill="none" stroke="#68E3BE" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="mn-pulse" d="M48 116 H92 L104 92 L116 132 L128 108 L150 108 H196 L208 84 L220 124 L232 108 H272"
        fill="none" stroke="#68E3BE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="84" r="3.4" fill="#E6F5EF"/>
  <!-- alert toast caught early -->
  <g class="mn-alert">
    <rect x="196" y="36" width="86" height="34" rx="8" fill="#EDD086"/>
    <path d="M213 46 l7 13 h-14 z" fill="#0A1A24"/>
    <rect x="210.5" y="51" width="2" height="4.4" rx="1" fill="#EDD086"/><circle cx="211.5" cy="57.4" r="1.1" fill="#EDD086"/>
    <rect x="228" y="46" width="44" height="4.5" rx="2" fill="#0A1A24"/>
    <rect x="228" y="55" width="30" height="3.6" rx="1.8" fill="#0A1A24" opacity="0.55"/>
  </g>
</svg>
