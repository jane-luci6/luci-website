<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Bar tablet controlling TV source and volume">
  <rect width="96" height="96" rx="16" fill="#10232D"/>
  <!-- TV -->
  <rect x="18" y="20" width="42" height="28" rx="4" fill="#143042" stroke="rgba(104,227,190,0.3)" stroke-width="1.2"/>
  <rect x="22" y="24" width="34" height="18" rx="2" fill="#0A1A24"/>
  <rect x="26" y="30" width="18" height="3" rx="1.5" fill="#68E3BE" opacity="0.7"/>
  <rect x="26" y="36" width="12" height="2.5" rx="1.2" fill="#E6F5EF" opacity="0.35"/>
  <path d="M34 48v4h10v-4" fill="none" stroke="rgba(104,227,190,0.35)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- bar counter -->
  <rect x="12" y="68" width="72" height="8" rx="2" fill="#143042" stroke="rgba(104,227,190,0.22)" stroke-width="1"/>
  <rect x="12" y="76" width="72" height="4" rx="1" fill="#0A1A24"/>
  <!-- bartender tablet -->
  <rect x="58" y="40" width="26" height="20" rx="3" fill="#0A1A24" stroke="#68E3BE" stroke-width="1.4"/>
  <rect x="62" y="44" width="10" height="3" rx="1.2" fill="#68E3BE" opacity="0.85"/>
  <rect x="62" y="50" width="14" height="2.5" rx="1.2" fill="#E6F5EF" opacity="0.4"/>
  <rect x="62" y="55" width="8" height="2" rx="1" fill="#E6F5EF" opacity="0.25"/>
  <!-- volume ticks -->
  <path d="M78 46v8M81 47.5v5M84 48.5v3" stroke="#68E3BE" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
</svg>
