# nginx server block for the LUCI website (internal review)
# Serves the static Astro build from /var/www/luci on port 80.
# Installed to /etc/nginx/sites-available/luci and enabled in sites-enabled.
# /var/www/luci is owned by the luci user so deploys need no sudo.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/luci;
    index index.html;

    # Clean URLs: Astro emits both /path/index.html and /file.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # HTML — always revalidate (review server; avoid stale page shells)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Static asset caching (short, since this is a review server)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map|txt|mp4|webm)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public";
    }

    # Light security headers
    add_header X-Content-Type-Options nosniff always;

    # Hide nginx version
    server_tokens off;
}
