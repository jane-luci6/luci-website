<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant C — Silo Towers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --navy-deep: #0A161C; --mint: #68E3BE; --off-white: #F5F8FA; --amber: #EDD086; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--navy-deep); color: var(--off-white); font-family: 'Inter', sans-serif; padding: 40px 20px; }
  .label { text-align: center; font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 0.22em; color: var(--mint); margin-bottom: 16px; }
  .desc { text-align: center; font-size: 14px; color: rgba(245,248,250,0.6); margin-bottom: 32px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  svg { width: 100%; max-width: 900px; height: auto; display: block; margin: 0 auto; }
  .s { font-family: 'Syncopate', sans-serif; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
  .b { font-size: 13px; line-height: 1.5; color: rgba(245,248,250,0.75); display: block; }
  .s1, .s1 ~ .b { color: #68E3BE; } .s2, .s2 ~ .b { color: #8ed3b5; } .s3, .s3 ~ .b { color: #bcae7a; } .s4, .s4 ~ .b { color: #EDD086; }
</style>
</head>
<body>
<div class="label">C — Silo Towers</div>
<div class="desc">A/V systems as vertical silo towers — each one a different vendor, standing alone. A "YOUR NETWORK" bar at the bottom they're not connected to. More silos appear per stage, alerts grow. The silo shape is immediately readable as "isolated, standalone."</div>
<svg viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet">
  <!-- YOUR NETWORK bar at bottom -->
  <rect x="40" y="208" width="920" height="6" rx="3" fill="rgba(104,227,190,0.2)"/>
  <text x="500" y="232" text-anchor="middle" fill="rgba(104,227,190,0.4)" font-size="11" font-family="Inter" letter-spacing="0.15em">YOUR NETWORK</text>
  <!-- S1: 1 silo -->
  <path d="M 105 200 L 105 130 Q 125 110 145 130 L 145 200 Z" fill="#0F1E26" stroke="#68E3BE" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="105" y1="200" x2="145" y2="200" stroke="#68E3BE" stroke-width="2.5"/>
  <foreignObject x="10" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s1">The Silos</span><span class="b">A/V runs on separate, proprietary systems — each one a black box you can't see into.</span></div></foreignObject>
  <!-- S2: 2 silos -->
  <path d="M 340 200 L 340 120 Q 360 100 380 120 L 380 200 Z" fill="#0F1E26" stroke="#8ed3b5" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="340" y1="200" x2="380" y2="200" stroke="#8ed3b5" stroke-width="2.5"/>
  <path d="M 385 200 L 385 140 Q 405 120 425 140 L 425 200 Z" fill="#0F1E26" stroke="#8ed3b5" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="385" y1="200" x2="425" y2="200" stroke="#8ed3b5" stroke-width="2.5"/>
  <path d="M 360 88 L 366 98 L 354 98 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="260" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s2">The Blind Spot</span><span class="b">You can't monitor what's running, what's exposed, or what's failing — because it's not on your network.</span></div></foreignObject>
  <!-- S3: 3 silos -->
  <path d="M 560 200 L 560 110 Q 580 90 600 110 L 600 200 Z" fill="#0F1E26" stroke="#bcae7a" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="560" y1="200" x2="600" y2="200" stroke="#bcae7a" stroke-width="2.5"/>
  <path d="M 610 200 L 610 130 Q 630 110 650 130 L 650 200 Z" fill="#0F1E26" stroke="#bcae7a" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="610" y1="200" x2="650" y2="200" stroke="#bcae7a" stroke-width="2.5"/>
  <path d="M 660 200 L 660 145 Q 680 125 700 145 L 700 200 Z" fill="#0F1E26" stroke="#bcae7a" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="660" y1="200" x2="700" y2="200" stroke="#bcae7a" stroke-width="2.5"/>
  <path d="M 580 78 L 586 88 L 574 88 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 630 98 L 636 108 L 624 108 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="510" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s3">The Vendors</span><span class="b">Each system came with its own vendor, contract, and support line — and none of them talk to each other.</span></div></foreignObject>
  <!-- S4: 4 silos -->
  <path d="M 790 200 L 790 100 Q 810 80 830 100 L 830 200 Z" fill="#0F1E26" stroke="#EDD086" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="790" y1="200" x2="830" y2="200" stroke="#EDD086" stroke-width="2.5"/>
  <path d="M 835 200 L 835 120 Q 855 100 875 120 L 875 200 Z" fill="#0F1E26" stroke="#EDD086" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="835" y1="200" x2="875" y2="200" stroke="#EDD086" stroke-width="2.5"/>
  <path d="M 880 200 L 880 135 Q 900 115 920 135 L 920 200 Z" fill="#0F1E26" stroke="#EDD086" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="880" y1="200" x2="920" y2="200" stroke="#EDD086" stroke-width="2.5"/>
  <path d="M 925 200 L 925 145 Q 945 125 965 145 L 965 200 Z" fill="#0F1E26" stroke="#EDD086" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="925" y1="200" x2="965" y2="200" stroke="#EDD086" stroke-width="2.5"/>
  <path d="M 810 68 L 816 78 L 804 78 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 855 88 L 861 98 L 849 98 Z" fill="#EDD086" fill-opacity="0.75"/>
  <path d="M 900 103 L 906 113 L 894 113 Z" fill="#EDD086" fill-opacity="0.75"/>
  <foreignObject x="760" y="260" width="230" height="180"><div xmlns="http://www.w3.org/1999/xhtml"><span class="s s4">The Page</span><span class="b">When any of it fails, it's your phone that rings — and you have no way to diagnose it.</span></div></foreignObject>
</svg>
</body>
</html>
